<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f1e1">
<title>Grow Room Coach — Cannabis Cultivation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400..700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f1e1;
  --paper-2:#efe7d2;
  --paper-3:#e6dcc1;
  --card:#fffaeb;
  --ink:#1c1812;
  --ink-2:#3d362a;
  --ink-3:#7a6f5a;
  --rule:#1c1812;
  --rule-soft:#c8bd9f;
  --accent:#2d5a3a;
  --accent-2:#3d7a4f;
  --accent-soft:#cfe0d4;
  --warn:#8a5a1f;
  --warn-soft:#ecdcb7;
  --risk:#8e2f24;
  --risk-soft:#ecc9c4;
  --shadow:0 1px 2px rgba(28,24,18,0.06), 0 4px 12px rgba(28,24,18,0.04);
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --nav-h: 68px;
  --hdr-h: 56px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);}
body{
  font-family:var(--serif);
  font-size:17px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  min-height:100vh;
  min-height:100dvh;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom, 0));
}
button{font-family:inherit;color:inherit;cursor:pointer}
input,textarea{font-family:inherit;color:inherit}

h1{font-size:1.55rem;line-height:1.2;margin:0 0 0.4em;font-weight:700;letter-spacing:-0.01em}
h2{font-size:1.2rem;line-height:1.25;margin:1.4em 0 0.5em;font-weight:700;letter-spacing:-0.005em}
h3{font-size:1.02rem;line-height:1.3;margin:1.1em 0 0.4em;font-weight:600}
p{margin:0 0 0.85em}
ul,ol{margin:0 0 0.85em;padding-left:1.3em}
li{margin-bottom:0.3em}
a{color:var(--accent);text-decoration:underline;text-decoration-color:rgba(45,90,58,0.4)}

/* ---------- HEADER ---------- */
.app-header{
  position:sticky;top:0;z-index:50;
  height:var(--hdr-h);
  background:var(--paper);
  border-bottom:1px solid var(--rule-soft);
  display:flex;align-items:center;
  padding:0 16px;gap:12px;
  padding-top:env(safe-area-inset-top, 0);
  height:calc(var(--hdr-h) + env(safe-area-inset-top, 0));
}
.app-header .back{
  background:none;border:0;padding:8px;margin-left:-8px;
  display:flex;align-items:center;justify-content:center;
  width:40px;height:40px;border-radius:6px;
}
.app-header .back:hover,.app-header .back:active{background:var(--paper-2)}
.app-header .back svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.app-header .title{
  flex:1;min-width:0;
  font-family:var(--serif);font-weight:600;font-size:1.05rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.app-header .brand{
  font-family:var(--mono);font-size:0.65rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-3);
}

/* ---------- MAIN ---------- */
main{
  max-width:640px;margin:0 auto;
  padding:16px 16px 28px;
}

/* ---------- BOTTOM NAV ---------- */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  height:var(--nav-h);
  background:var(--paper);
  border-top:1px solid var(--rule-soft);
  display:grid;grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom, 0);
  height:calc(var(--nav-h) + env(safe-area-inset-bottom, 0));
}
.nav-tab{
  background:none;border:0;padding:8px 4px 6px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--ink-3);
}
.nav-tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-tab span{
  font-family:var(--mono);font-size:0.62rem;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;
}
.nav-tab.active{color:var(--accent)}
.nav-tab.active svg{stroke-width:2.2}

/* ---------- CARDS ---------- */
.card{
  background:var(--card);
  border:1px solid var(--rule-soft);
  border-radius:10px;
  padding:16px;
  margin:0 0 12px;
  box-shadow:var(--shadow);
}
.card-tappable{
  width:100%;text-align:left;
  background:var(--card);
  border:1px solid var(--rule-soft);
  border-radius:10px;
  padding:14px 16px;
  margin:0 0 10px;
  display:flex;align-items:center;gap:12px;
  box-shadow:var(--shadow);
  color:var(--ink);
  font-family:var(--serif);font-size:1rem;line-height:1.35;
  min-height:56px;
}
.card-tappable:active{background:var(--paper-2);transform:scale(0.997)}
.card-tappable .icon{
  flex:0 0 36px;width:36px;height:36px;
  background:var(--accent-soft);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
}
.card-tappable .icon svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card-tappable .body{flex:1;min-width:0}
.card-tappable .body .lbl{font-weight:600;display:block}
.card-tappable .body .sub{display:block;font-size:0.85rem;color:var(--ink-3);margin-top:2px}
.card-tappable .chev{flex:0 0 16px;color:var(--ink-3)}
.card-tappable .chev svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.card.accent{border-left:4px solid var(--accent)}
.card.warn{border-left:4px solid var(--warn);background:var(--warn-soft)}
.card.risk{border-left:4px solid var(--risk);background:var(--risk-soft)}
.card h3:first-child,.card h2:first-child{margin-top:0}
.card p:last-child{margin-bottom:0}

/* ---------- BUTTONS ---------- */
.btn{
  font-family:var(--mono);font-weight:600;
  font-size:0.78rem;letter-spacing:0.1em;text-transform:uppercase;
  background:var(--paper);color:var(--ink);
  border:1px solid var(--rule);
  padding:12px 18px;cursor:pointer;
  border-radius:8px;
  min-height:44px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn:active{transform:scale(0.98)}
.btn.primary{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:var(--rule-soft);color:var(--ink-2)}
.btn.danger{border-color:var(--risk);color:var(--risk)}
.btn.block{display:flex;width:100%}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}

/* ---------- SECTION HEAD ---------- */
.section-head{margin:0 0 14px}
.section-head .eyebrow{
  font-family:var(--mono);font-size:0.66rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-3);font-weight:600;
}
.section-head h1{margin:4px 0 6px}
.section-head .lead{font-size:0.95rem;color:var(--ink-2);margin:0}

/* ---------- SVG DIAGRAMS ---------- */
.diagram{
  background:var(--paper-2);
  border:1px solid var(--rule-soft);
  border-radius:10px;
  padding:14px;
  margin:0 0 16px;
}
.diagram svg{display:block;width:100%;height:auto;max-height:280px}
.diagram .cap{
  font-family:var(--mono);font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--ink-3);margin-top:10px;text-align:center;
}

/* ---------- INLINE TERMS ---------- */
.term-link{
  background:none;border:0;padding:0;margin:0;
  font-family:inherit;font-size:inherit;line-height:inherit;color:var(--accent);
  border-bottom:1px dashed var(--accent);
  cursor:pointer;
}
.term-link:active{background:var(--accent-soft)}

/* ---------- DEF MODAL ---------- */
.modal-backdrop{
  position:fixed;inset:0;z-index:100;
  background:rgba(28,24,18,0.45);
  display:flex;align-items:flex-end;justify-content:center;
}
.modal{
  background:var(--paper);
  border-top-left-radius:14px;border-top-right-radius:14px;
  padding:20px 18px 28px;
  max-width:640px;width:100%;
  max-height:75vh;overflow-y:auto;
  padding-bottom:calc(28px + env(safe-area-inset-bottom, 0));
  animation:slideUp 200ms ease;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h3{margin-top:0}
.modal .close{
  background:none;border:0;float:right;padding:4px 8px;font-family:var(--mono);font-size:0.78rem;color:var(--ink-3);
}
.modal .term-head{font-family:var(--mono);font-size:0.7rem;color:var(--ink-3);letter-spacing:0.08em;text-transform:uppercase}

/* ---------- WIZARD ---------- */
.wizard-progress{
  display:flex;gap:4px;margin:0 0 14px;
}
.wizard-progress .dot{
  flex:1;height:4px;border-radius:2px;background:var(--rule-soft);
}
.wizard-progress .dot.done{background:var(--accent)}
.wizard-progress .dot.active{background:var(--accent);opacity:0.5}

.wiz-q{
  font-size:1.1rem;font-weight:600;line-height:1.3;margin:8px 0 14px;
}
.wiz-hint{
  font-size:0.85rem;color:var(--ink-3);font-style:italic;margin:0 0 14px;
}
.wiz-opt{
  width:100%;text-align:left;
  background:var(--card);
  border:1.5px solid var(--rule-soft);
  border-radius:10px;
  padding:14px 16px;margin:0 0 8px;
  font-size:1rem;line-height:1.35;
  color:var(--ink);
  min-height:52px;
  display:flex;align-items:center;gap:12px;
}
.wiz-opt:active{background:var(--paper-2)}
.wiz-opt .key{
  font-family:var(--mono);font-size:0.75rem;color:var(--accent);font-weight:700;
  flex:0 0 22px;
}

/* ---------- DIAGNOSIS CARD ---------- */
.diag-card{
  border:2px solid var(--accent);
  background:var(--card);
  border-radius:10px;
  padding:18px;
  margin:0 0 14px;
  box-shadow:var(--shadow);
}
.diag-card .code{
  font-family:var(--mono);font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--accent);font-weight:700;
}
.diag-card h2{margin:6px 0 8px;font-size:1.2rem}
.diag-card .severity{
  display:inline-block;
  font-family:var(--mono);font-size:0.66rem;letter-spacing:0.12em;text-transform:uppercase;font-weight:700;
  padding:3px 8px;border-radius:4px;margin-left:8px;
}
.diag-card .severity.high{background:var(--risk);color:var(--paper)}
.diag-card .severity.med{background:var(--warn);color:var(--paper)}
.diag-card .severity.low{background:var(--accent);color:var(--paper)}

.chain-walk{
  background:var(--paper-2);
  padding:12px 14px;border-radius:8px;
  margin:10px 0 14px;
  font-family:var(--mono);font-size:0.82rem;line-height:1.5;
}
.chain-walk .step{display:block;color:var(--ink-2);margin-bottom:2px}
.chain-walk .root{color:var(--risk);font-weight:700}

.action-block{
  background:var(--accent-soft);
  border-left:4px solid var(--accent);
  padding:12px 14px;border-radius:0 8px 8px 0;
  margin:10px 0;
}
.action-block .lbl{font-family:var(--mono);font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:4px}
.action-block .what{font-size:1rem;font-weight:600;color:var(--ink)}

.warn-block{
  background:var(--warn-soft);
  border-left:4px solid var(--warn);
  padding:10px 14px;border-radius:0 8px 8px 0;
  margin:10px 0;font-size:0.92rem;
}

/* ---------- SELF CHECK ---------- */
.check-q{
  background:var(--card);
  border:1px solid var(--rule-soft);
  border-radius:10px;
  padding:14px;margin:0 0 12px;
}
.check-q .q-num{
  font-family:var(--mono);font-size:0.66rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;
}
.check-q .q-text{font-size:1rem;font-weight:600;margin:4px 0 10px}
.check-opt{
  width:100%;text-align:left;
  background:var(--paper);border:1.5px solid var(--rule-soft);border-radius:8px;
  padding:10px 14px;margin:0 0 6px;
  font-size:0.94rem;line-height:1.3;color:var(--ink);
  min-height:44px;
}
.check-opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.check-opt.correct{border-color:var(--accent);background:var(--accent-soft)}
.check-opt.wrong{border-color:var(--risk);background:var(--risk-soft)}
.check-feedback{
  font-size:0.86rem;color:var(--ink-2);font-style:italic;
  margin-top:8px;padding:8px 10px;background:var(--paper-2);border-radius:6px;
}

/* ---------- REFERENCE ---------- */
.ref-tabs{
  display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 14px;
}
.ref-tab{
  font-family:var(--mono);font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;
  background:var(--paper);color:var(--ink-2);
  border:1px solid var(--rule-soft);border-radius:8px;
  padding:10px 4px;min-height:44px;
}
.ref-tab.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.list-item{
  background:var(--card);border:1px solid var(--rule-soft);border-radius:8px;
  padding:12px 14px;margin:0 0 8px;
  width:100%;text-align:left;
  display:flex;align-items:center;gap:10px;
  color:var(--ink);font-size:0.96rem;
  min-height:48px;
}
.list-item .badge{
  font-family:var(--mono);font-size:0.66rem;letter-spacing:0.08em;color:var(--ink-3);text-transform:uppercase;
  background:var(--paper-2);padding:2px 6px;border-radius:4px;
}
.list-item .nm{flex:1;font-weight:500}

/* ---------- ATHENA TARGETS TABLE ---------- */
.targets-card table{width:100%;border-collapse:collapse;font-size:0.82rem;font-family:var(--mono)}
.targets-card th{font-size:0.66rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:6px 4px;border-bottom:1px solid var(--rule-soft);font-weight:600}
.targets-card td{padding:6px 4px;border-bottom:1px solid var(--paper-3);vertical-align:top}
.targets-card tr:last-child td{border-bottom:0}
.targets-card td:first-child{font-weight:600;font-family:var(--serif);font-size:0.86rem}

/* ---------- SEARCH ---------- */
.search-input{
  width:100%;background:var(--card);
  border:1px solid var(--rule-soft);border-radius:8px;
  padding:12px 14px;font-size:1rem;margin:0 0 12px;
  min-height:44px;
}
.search-input:focus{outline:2px solid var(--accent);border-color:var(--accent)}

/* ---------- ASSESSMENT ---------- */
.assess-input{
  width:100%;background:var(--card);
  border:1px solid var(--rule-soft);border-radius:8px;
  padding:12px 14px;font-size:1rem;
  min-height:44px;
}
.assess-textarea{
  width:100%;background:var(--card);
  border:1px solid var(--rule-soft);border-radius:8px;
  padding:12px 14px;font-size:0.96rem;line-height:1.45;
  min-height:120px;resize:vertical;font-family:var(--serif);
}
.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.score-cell{
  background:var(--paper-2);border-radius:8px;padding:10px 12px;text-align:center;
  border:1px solid var(--rule-soft);
}
.score-cell .lbl{font-family:var(--mono);font-size:0.62rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.score-cell .val{font-family:var(--mono);font-size:1.4rem;font-weight:700;color:var(--ink);line-height:1.1;margin-top:4px}
.score-cell.pass .val{color:var(--accent)}
.score-cell.fail .val{color:var(--risk)}
.verdict{font-family:var(--mono);font-size:0.92rem;letter-spacing:0.1em;text-transform:uppercase;font-weight:700;padding:12px;text-align:center;border-radius:8px;margin:10px 0}
.verdict.pass{background:var(--accent);color:var(--paper)}
.verdict.fail{background:var(--risk);color:var(--paper)}

/* ---------- CERTIFICATE (kept from textbook) ---------- */
.certificate{
  border:6px double var(--ink);padding:24px 18px;background:var(--paper);
  position:relative;margin:14px 0;
}
.certificate .cert-brand{font-family:var(--mono);font-size:0.7rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--ink);text-align:center;margin-bottom:6px}
.certificate .cert-mark{text-align:center;font-family:var(--mono);font-size:0.62rem;letter-spacing:0.14em;color:var(--ink-3);margin-bottom:18px;text-transform:uppercase}
.certificate .cert-title{text-align:center;font-family:var(--serif);font-size:1.6rem;font-weight:700;margin:0 0 4px;line-height:1.1}
.certificate .cert-sub{text-align:center;font-style:italic;color:var(--ink-2);margin:0 0 18px;font-size:0.95rem}
.certificate .cert-name-lbl{text-align:center;font-family:var(--mono);font-size:0.66rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.certificate .cert-name{text-align:center;font-family:var(--serif);font-size:1.5rem;font-weight:600;font-style:italic;border-bottom:1px solid var(--ink);padding-bottom:6px;margin:0 12px 18px}
.certificate .cert-body{text-align:center;font-size:0.92rem;margin:14px 0;line-height:1.5;color:var(--ink-2)}
.certificate .cert-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:14px 0;border-top:1px solid var(--rule-soft);border-bottom:1px solid var(--rule-soft);padding:8px 0}
.certificate .cert-stat{text-align:center}
.certificate .cert-stat .l{font-family:var(--mono);font-size:0.6rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-3)}
.certificate .cert-stat .v{font-family:var(--mono);font-size:0.85rem;color:var(--ink);font-weight:700;margin-top:2px}
.certificate .sigs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 8px 0}
.certificate .sig{text-align:center}
.certificate .sig-line{border-bottom:1px solid var(--ink);height:1.8em;margin-bottom:4px}
.certificate .sig-lbl{font-family:var(--mono);font-size:0.62rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-3)}
.certificate .cert-id{text-align:center;font-family:var(--mono);font-size:0.6rem;letter-spacing:0.14em;color:var(--ink-3);margin-top:14px;text-transform:uppercase}

/* ---------- DESKTOP TWEAKS ---------- */
@media (min-width:760px){
  body{font-size:18px}
  main{padding:24px 24px 36px;max-width:720px}
  .diagram svg{max-height:340px}
  h1{font-size:1.85rem}
  h2{font-size:1.35rem}
  .ref-tab{padding:12px 8px}
}

/* ---------- PRINT (certificate only) ---------- */
@media print{
  .app-header,.bottom-nav,.btn-row,.btn,.modal-backdrop{display:none !important}
  body{background:#fff;color:#000;padding:0}
  main{padding:0;max-width:none}
  body[data-print="cert"] main > *:not(.certificate-host){display:none !important}
  body[data-print="cert"] .certificate-host{display:block !important}
  .certificate{border-color:#000;page-break-inside:avoid}
}

/* ---------- UTILITIES ---------- */
.muted{color:var(--ink-3)}
.mono{font-family:var(--mono)}
.center{text-align:center}
.spacer-sm{height:8px}
.spacer-md{height:16px}
.spacer-lg{height:32px}
.refresh-warn{
  font-family:var(--mono);font-size:0.7rem;color:var(--warn);
  background:var(--warn-soft);padding:8px 12px;border-radius:6px;
  border:1px solid var(--warn);margin:8px 0;
}
.pull-quote{
  font-family:var(--serif);font-size:1.05rem;font-style:italic;line-height:1.4;
  border-left:3px solid var(--accent);padding:8px 0 8px 14px;margin:14px 0;color:var(--ink-2);
}
</style>
</head>
<body>
<header class="app-header">
  <button class="back" id="back-btn" hidden aria-label="Back">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="title" id="hdr-title">Grow Room Coach</div>
  <div class="brand">L/A</div>
</header>
<main id="main" tabindex="-1"></main>
<nav class="bottom-nav" id="bottom-nav" aria-label="Sections"></nav>
<div id="modal-host"></div>
<script>
"use strict";
// =====================================================================
//  GROW ROOM COACH — Mobile-first interactive learning app
//  Companion to grow-room-systems-training.html (textbook)
//  Single file, no persistence, no external JS, vanilla.
// =====================================================================

const state = {
  section: "learn",                // learn | diagnose | reference | test
  // LEARN
  lessonId: null,                  // 0..5 or null = lesson index

function setSub(path, val){

function escapeHtml(s){

function renderNav(){
  el("bottom-nav").innerHTML = NAV_TABS.map(t => `
    <button class="nav-tab ${state.section===t.id?"active":""}" data-section="${t.id}" aria-label="${t.label}">
      <svg viewBox="0 0 24 24">${t.icon}</svg>
      <span>${t.label}</span>
    </button>
  `).join("");
  el("bottom-nav").querySelectorAll(".nav-tab").forEach(b => {
    b.addEventListener("click", () => {
      const s = b.dataset.section;
      // reset sub-state when switching tabs
      if (s === "learn")     setState({ section:s, lessonId:null });
      else if (s === "diagnose") setState({ section:s, wizard:{ symptomId:null, step:0, answers:[], resultId:null } });
      else if (s === "reference") setState({ section:s, refSelected:null });
      else if (s === "test")  setState({ section:s, testMode:null });

function renderHeader(){
  let title = "Grow Room Coach", showBack = false;
  if (state.section === "learn" && state.lessonId !== null) {
    title = LESSONS[state.lessonId].title; showBack = true;
  } else if (state.section === "diagnose" && state.wizard.symptomId !== null) {
    const sym = SYMPTOMS.find(s => s.id === state.wizard.symptomId);
    title = sym ? sym.label : "Diagnose"; showBack = true;
  } else if (state.section === "reference" && state.refSelected !== null) {
    title = "Reference"; showBack = true;
  } else if (state.section === "test" && state.testMode !== null) {
    title = state.testMode === "quick" ? "Quick check" : "Full assessment"; showBack = true;
  } else {
    title = { learn:"Learn", diagnose:"Diagnose", reference:"Reference", test:"Test" }[state.section];
  }
  el("hdr-title").textContent = title;
  el("back-btn").hidden = !showBack;
}

el("back-btn").addEventListener("click", () => {
  if (state.section === "learn" && state.lessonId !== null) setState({ lessonId:null });
  else if (state.section === "diagnose") {
    if (state.wizard.resultId) setState({ wizard:{ ...state.wizard, resultId:null } });
    else if (state.wizard.step > 0) setState({ wizard:{ ...state.wizard, step: state.wizard.step - 1, answers: state.wizard.answers.slice(0,-1) } });
    else setState({ wizard:{ symptomId:null, step:0, answers:[], resultId:null } });
  }
  else if (state.section === "reference" && state.refSelected !== null) setState({ refSelected:null });
  else if (state.section === "test" && state.testMode !== null) setState({ testMode:null });
  window.scrollTo(0,0);
});

// =====================================================================
//  MAIN RENDER DISPATCH (chapter-data + section renderers added below)
// =====================================================================
function render(){
  renderNav();
  renderHeader();
  // Routes dispatch to section renderers added in later script chunks
  const main = el("main");
  if (state.section === "learn")     main.innerHTML = renderLearn();
  else if (state.section === "diagnose")  main.innerHTML = renderDiagnose();
  else if (state.section === "reference") main.innerHTML = renderReference();
  else if (state.section === "test") main.innerHTML = renderTest();
  bindMainEvents();
  renderModal();
}

function bindMainEvents(){
  document.querySelectorAll("[data-act]").forEach(n => {
    n.addEventListener("click", e => {
      e.preventDefault();
      handleAction(n.dataset.act, n);
    });
  });
  document.querySelectorAll("[data-inp]").forEach(n => {
    n.addEventListener("input", () => handleInput(n.dataset.inp, n));
  });
  document.querySelectorAll(".term-link").forEach(n => {
    n.addEventListener("click", e => {
      e.preventDefault();
      setState({ defTerm: n.dataset.term });
    });
  });
}

function handleInput(path, node){
  const k = path.split(".");
  let o = state;
  for (let i = 0; i < k.length - 1; i++) o = o[k[i]];
  o[k[k.length-1]] = node.value;
  if (path === "refSearch") render();
}

// action handlers will be added in later chunks; this stub catches unknown actions
function handleAction(act, node){
  if (typeof ACTIONS !== "undefined" && ACTIONS[act]) ACTIONS[act](node);
  else console.warn("unknown action:", act);
}

// modal renderer
function renderModal(){
  const host = el("modal-host");
  if (!state.defTerm) { host.innerHTML = ""; return; }
  const d = DEFINITIONS.find(x => x.term === state.defTerm) ||
            { term: state.defTerm, expand:"", body:"(no definition found)" };
  host.innerHTML = `
    <div class="modal-backdrop" id="modal-bd">
      <div class="modal" onclick="event.stopPropagation()">
        <button class="close" data-act="close-modal">CLOSE ✕</button>
        <div class="term-head">Definition</div>
        <h3>${escapeHtml(d.term)}${d.expand ? ` <span class="muted" style="font-weight:400">— ${escapeHtml(d.expand)}</span>` : ""}</h3>
        <p>${escapeHtml(d.body)}</p>
      </div>
    </div>
  `;
  document.getElementById("modal-bd").addEventListener("click", () => setState({ defTerm:null }));
  document.querySelectorAll("[data-act=close-modal]").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); setState({ defTerm:null }); }));
}

  // 2) FOUR BALANCES — four small balance icons with in/out arrows

  // 4) THE CHAIN — vertical flow of 11 nodes
  chain: () => {
    const nodes = [
      ["1","Light",      "PPFD at canopy"],
      ["2","Leaf temp",  "Heats up"],
      ["3","Leaf VPD",   "Air pull rises"],
      ["4","Transpire",  "Water leaves leaf"],
      ["5","Dryback",    "WC falls"],
      ["6","Pore EC",    "Salt concentrates"],
      ["7","Water status","Plant defends"],
      ["8","Photosynth.",  "Sugar made"],
      ["9","CO₂ demand", "Pulled from air"],
      ["10","HVAC load", "Heat + water out"],
      ["11","Disease",   "If load not cleared"]
    ];
    return `
    <svg viewBox="0 0 360 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The chain — 11 nodes">
      <defs>
        <marker id="ch-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0 0 L10 5 L0 10 z" fill="#2d5a3a"/>

      ${nodes.map((n, i) => {
        const y = 14 + i * 47;
        return `
          <rect x="40" y="${y}" width="280" height="36" rx="6" fill="#fffaeb" stroke="#2d5a3a" stroke-width="1.5"/>
          <circle cx="60" cy="${y+18}" r="11" fill="#2d5a3a"/>

          <text x="82" y="${y+17}" font-family="Source Serif 4" font-size="13" font-weight="600" fill="#1c1812">${n[1]}</text>
          <text x="82" y="${y+30}" font-family="IBM Plex Mono" font-size="9" fill="#7a6f5a">${n[2]}</text>
          ${i < nodes.length - 1 ? `<line x1="180" y1="${y+38}" x2="180" y2="${y+45}" stroke="#2d5a3a" stroke-width="2" marker-end="url(#ch-ar)"/>` : ""}
        `;
      }).join("")}
    </svg>
    <div class="cap">Walk forward to predict the cost of a change. Walk backward from a symptom to find what to actually fix.</div>
    `;
  },

function renderDiagnose(){
  const w = state.wizard;

  // home: symptom grid
  if (!w.symptomId) {
    return `
      <div class="section-head">
        <div class="eyebrow">Section 2 · Diagnose</div>
        <h1>What are you seeing?</h1>
        <p class="lead">Pick the symptom that best matches what you're looking at right now. The wizard will ask 2–4 follow-up questions and land on a diagnosis with the lever to move.</p>
      </div>
      ${SYMPTOMS.map(s => `
        <button class="card-tappable" data-act="pick-symptom" data-id="${s.id}">
          <span class="icon"><svg viewBox="0 0 24 24">${s.icon}</svg></span>
          <span class="body">
            <span class="lbl">${escapeHtml(s.label)}</span>
            <span class="sub">${escapeHtml(s.sub)}</span>
          </span>
          <span class="chev"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>
        </button>
      `).join("")}
      <div class="card" style="margin-top:18px">
        <h3>How the wizard works</h3>
        <p>Each path is 2–3 questions long. There are no trick answers; pick the option that fits closest to what's actually happening. If you're unsure of a number, the wizard accepts "don't know" and routes around it.</p>
        <p style="margin-bottom:0">The diagnosis card shows the failure mode, where the chain broke, what to do <em>first</em>, and what to recheck after one cycle. Print it or screenshot it — there's no saved history.</p>
      </div>
    `;
  }

  // diagnosis result page
  if (w.resultId) {
    const d = DIAGNOSES[w.resultId];
    if (!d) return `<p>Diagnosis not found.</p>`;
    return `
      <div class="diag-card">
        <div class="code">${escapeHtml(d.code)}<span class="severity ${d.severity}">${d.severity}</span></div>
        <h2>${escapeHtml(d.title)}</h2>
        <p>${escapeHtml(d.summary)}</p>

        <h3 style="font-family:var(--mono);font-size:0.78rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 6px">Chain walk</h3>
        <div class="chain-walk">
          ${d.chain.map((s, i) => `<span class="step">${i+1}. ${escapeHtml(s)}</span>`).join("")}
          ${d.rootNode !== null && d.rootNode !== undefined ? `<span class="step root">↑ Root cause: Node ${d.rootNode}</span>` : ""}
        </div>

        <div class="action-block">
          <div class="lbl">First action</div>
          <div class="what">${escapeHtml(d.action)}</div>
        </div>

        <h3 style="font-family:var(--mono);font-size:0.78rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 6px">Confirm after one cycle</h3>
        <ul>
          ${d.confirm.map(c => `<li>${escapeHtml(c)}</li>`).join("")}
        </ul>

        <div class="warn-block">
          <strong>Then wait.</strong> One full cycle (lights-on to lights-on or one irrigation cycle) before you change anything else. If the symptom hasn't moved by then, escalate to the cultivation lead.
        </div>

        <div class="btn-row" style="margin-top:18px">
          <button class="btn primary" data-act="wizard-restart">Diagnose again</button>
          <button class="btn ghost" data-act="go-section" data-section="reference">Open reference</button>
        </div>
      </div>
    `;
  }

  // question screen
  const flow = WIZARD_FLOWS[w.symptomId];
  const sym = SYMPTOMS.find(s => s.id === w.symptomId);
  if (!flow) return `<p>No flow defined for "${escapeHtml(w.symptomId)}".</p>`;

  // step pointer — find current step by following answers
  let currentStep = flow[0];
  for (const ans of w.answers) {
    const opt = currentStep.opts.find(o => o.k === ans);
    if (!opt) break;
    if (opt.go) currentStep = flow.find(s => s.id === opt.go);
    if (!currentStep) break;
  }
  if (!currentStep) return `<p>Flow ended unexpectedly.</p>`;

  // progress dots — use answer count vs an estimated 3 questions per path
  const totalGuess = 3;
  const dots = Array.from({length: totalGuess}, (_, i) => {
    const cls = i < w.answers.length ? "done" : (i === w.answers.length ? "active" : "");
    return `<span class="dot ${cls}"></span>`;
  }).join("");

  return `
    <div class="section-head">
      <div class="eyebrow">Diagnose · ${escapeHtml(sym.label)}</div>
      <div class="wizard-progress">${dots}</div>
    </div>
    <div class="wiz-q">${escapeHtml(currentStep.q)}</div>
    <p class="wiz-hint">Pick the closest match. If a number isn't measured yet, choose "don't know" if available.</p>
    ${currentStep.opts.map(o => `
      <button class="wiz-opt" data-act="wizard-answer" data-key="${o.k}">
        <span class="key">${o.k.toUpperCase()}.</span>
        <span>${escapeHtml(o.label)}</span>
      </button>
    `).join("")}
  `;
}

function mcqScore(){
  const a = state.assessment.answers;
  let correct = 0;
  MCQ_BANK.forEach(q => { if (a[q.id] === q.correct) correct++; });
  return { correct, total: MCQ_BANK.length, pct: Math.round((correct / MCQ_BANK.length) * 100) };
}
function scenarioScore(){
  const m = state.assessment.marks;
  let sum = 0;
  [1,2,3].forEach(k => { if (m[k] !== null && m[k] !== undefined) sum += m[k]; });
  return { sum, max: 9, pct: Math.round((sum / 9) * 100) };
}
function overallScore(){
  const m = mcqScore(); const s = scenarioScore();
  return { earned: m.correct + s.sum, possible: m.total + s.max, pct: Math.round(((m.correct + s.sum)/(m.total + s.max))*100) };
}
function isPass(){
  const o = overallScore(), m = mcqScore(), s = scenarioScore();
  return o.pct >= 80 && m.pct >= 60 && s.pct >= 50;
}
function generateCertId(d){
  const pad = n => String(n).padStart(2,"0");
  const y=d.getFullYear(), mo=pad(d.getMonth()+1), da=pad(d.getDate()), hh=pad(d.getHours()), mm=pad(d.getMinutes());
  return `GRS-${y}${mo}${da}-${hh}${mm}-${String(Math.floor(1000+Math.random()*9000))}`;
}
function fmtDate(d){
  if (!d) return "";
  const months=["January","February","March","April","May","June","July","August","September","October","November","December"];
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

function renderTest(){
  if (state.testMode === null) {
    return `
      <div class="section-head">
        <div class="eyebrow">Section 4 · Test</div>
        <h1>Check your understanding</h1>
        <p class="lead">Two options — a quick 3-question self-check, or the full Cultivation assessment.</p>
      </div>

      <button class="card-tappable" data-act="start-test" data-mode="quick">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg></span>
        <span class="body">
          <span class="lbl">Quick check (3 random MCQs)</span>
          <span class="sub">~2 minutes. No record kept. For your own confidence.</span>
        </span>
        <span class="chev"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>
      </button>

      <button class="card-tappable" data-act="start-test" data-mode="full">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></span>
        <span class="body">
          <span class="lbl">Full assessment</span>
          <span class="sub">8 MCQ + 3 scenarios. Pass = ≥80% overall, ≥60% MCQ, ≥50% scenarios. Certificate on pass.</span>
        </span>
        <span class="chev"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>
      </button>

      <div class="refresh-warn">
        <strong>Reload wipes everything.</strong> The full assessment must be done in one sitting. The printed certificate is the only durable record.
      </div>
    `;
  }

  if (state.testMode === "quick") return renderQuickTest();
  if (state.testMode === "full")  return renderFullAssessment();
}

function renderQuickTest(){
  const q = state.quick;
  // initialise question selection if not already
  if (q.qIds.length === 0) {
    const ids = MCQ_BANK.map(x => x.id);
    // pick 3 random
    const picked = [];
    while (picked.length < 3) {
      const i = Math.floor(Math.random() * ids.length);
      if (!picked.includes(ids[i])) picked.push(ids[i]);
    }
    state.quick.qIds = picked;
  }
  const qs = q.qIds.map(id => MCQ_BANK.find(x => x.id === id));
  const submitted = q.submitted;
  const score = qs.filter(x => q.answers[x.id] === x.correct).length;
  return `
    <div class="section-head">
      <div class="eyebrow">Test · Quick check</div>
      <h1>3 questions</h1>
      <p class="lead">Pick the best answer to each. You'll see the explanation after submitting.</p>
    </div>
    ${qs.map((qq, i) => {
      const picked = q.answers[qq.id];
      return `
        <div class="check-q">
          <div class="q-num">Question ${i+1} of 3</div>
          <div class="q-text">${escapeHtml(qq.text)}</div>
          ${qq.options.map(o => {
            let cls = "check-opt";
            if (submitted) {
              if (o.k === qq.correct) cls += " correct";
              if (picked === o.k && o.k !== qq.correct) cls += " wrong";
            } else if (picked === o.k) cls += " sel";
            return `<button class="${cls}" data-act="quick-pick" data-q="${qq.id}" data-opt="${o.k}"${submitted?" disabled":""}>${escapeHtml(o.t)}</button>`;
          }).join("")}
          ${submitted ? `<div class="check-feedback"><strong>Why:</strong> ${escapeHtml(qq.why)}</div>` : ""}
        </div>
      `;
    }).join("")}
    ${submitted ? `
      <div class="card ${score === 3 ? "accent" : (score >= 2 ? "" : "risk")}" style="text-align:center;margin-top:18px">
        <h3 style="margin-top:0">${score}/3 correct</h3>
        <p style="margin-bottom:14px">${score === 3 ? "Strong. Ready for the full assessment." : score >= 2 ? "Solid grasp. One more loop through the lessons and try the full assessment." : "Re-read lessons 1–4 and come back."}</p>
        <div class="btn-row" style="justify-content:center">
          <button class="btn primary" data-act="quick-restart">Try 3 more</button>
          <button class="btn ghost" data-act="back-test">Back</button>
        </div>
      </div>
    ` : `
      <div class="btn-row" style="margin-top:18px">
        <button class="btn primary block" data-act="quick-submit">Submit & see explanations</button>
      </div>
    `}
  `;
}

function renderFullAssessment(){
  const a = state.assessment;
  const submitted = a.submitted;
  const mcq = mcqScore(); const sc = scenarioScore(); const ov = overallScore(); const pass = isPass();

  const mcqHTML = MCQ_BANK.map((q, i) => {
    const picked = a.answers[q.id];
    return `
      <div class="check-q">
        <div class="q-num">Q ${i+1} of ${MCQ_BANK.length}</div>
        <div class="q-text">${escapeHtml(q.text)}</div>
        ${q.options.map(o => {
          let cls = "check-opt";
          if (submitted) {
            if (o.k === q.correct) cls += " correct";
            if (picked === o.k && o.k !== q.correct) cls += " wrong";
          } else if (picked === o.k) cls += " sel";
          return `<button class="${cls}" data-act="full-pick" data-q="${q.id}" data-opt="${o.k}"${submitted?" disabled":""}>${escapeHtml(o.t)}</button>`;
        }).join("")}
        ${submitted ? `<div class="check-feedback"><strong>Why:</strong> ${escapeHtml(q.why)}</div>` : ""}
      </div>
    `;
  }).join("");

  const scnHTML = SCENARIOS.map(s => `
    <div class="check-q">
      <div class="q-num">Scenario ${s.id} of 3 · ${escapeHtml(s.title)}</div>
      <div class="q-text">${escapeHtml(s.prompt)}</div>
      <textarea class="assess-textarea" data-inp="assessment.scenarios.${s.id}" placeholder="Type your answer here.">${escapeHtml(a.scenarios[s.id] || "")}</textarea>
      ${submitted ? `
        <div style="margin-top:10px">
          <div class="q-num" style="margin-bottom:6px">Trainer mark (0 absent · 1 partial · 2 competent · 3 fluent)</div>
          <div class="btn-row" style="gap:6px;margin:0">
            ${[0,1,2,3].map(m => `<button class="btn ${a.marks[s.id]===m?"primary":"ghost"}" data-act="mark-scenario" data-s="${s.id}" data-m="${m}" style="min-width:48px;padding:10px 14px">${m}</button>`).join("")}
          </div>
        </div>
      ` : ""}
    </div>
  `).join("");

  return `
    <div class="section-head">
      <div class="eyebrow">Test · Full assessment</div>
      <h1>Cannabis Grow Room Systems</h1>
      <p class="lead">8 multiple-choice (auto-scored) + 3 scenarios (trainer-marked). Pass: ≥80% overall, ≥60% MCQ, ≥50% scenarios.</p>
      <div class="refresh-warn">Sit it in one go — reload wipes everything.</div>
    </div>

    <h2>Identification</h2>
    <div style="margin-bottom:8px">
      <div style="font-family:var(--mono);font-size:0.7rem;letter-spacing:0.1em;color:var(--ink-3);text-transform:uppercase;margin-bottom:4px">Trainee name</div>
      <input type="text" class="assess-input" value="${escapeHtml(a.name)}" data-inp="assessment.name" placeholder="Full name"${submitted?" disabled":""}>
    </div>
    <div style="margin-bottom:18px">
      <div style="font-family:var(--mono);font-size:0.7rem;letter-spacing:0.1em;color:var(--ink-3);text-transform:uppercase;margin-bottom:4px">Trainer name</div>
      <input type="text" class="assess-input" value="${escapeHtml(a.trainer)}" data-inp="assessment.trainer" placeholder="Trainer's name"${submitted?" disabled":""}>
    </div>

    <h2>Section A — Multiple choice</h2>
    ${mcqHTML}

    <h2>Section B — Scenarios</h2>
    ${scnHTML}

    ${submitted ? `
      <div class="card" style="margin-top:24px">
        <h3 style="margin-top:0">Result</h3>
        <div class="score-grid">
          <div class="score-cell ${mcq.pct>=60?"pass":"fail"}">
            <div class="lbl">MCQ</div>
            <div class="val">${mcq.correct}/${mcq.total}</div>
            <div class="lbl" style="margin-top:4px">${mcq.pct}% · gate ≥60%</div>
          </div>
          <div class="score-cell ${sc.pct>=50?"pass":"fail"}">
            <div class="lbl">Scenarios</div>
            <div class="val">${sc.sum}/${sc.max}</div>
            <div class="lbl" style="margin-top:4px">${sc.pct}% · gate ≥50%</div>
          </div>
          <div class="score-cell ${ov.pct>=80?"pass":"fail"}">
            <div class="lbl">Overall</div>
            <div class="val">${ov.pct}%</div>
            <div class="lbl" style="margin-top:4px">${ov.earned}/${ov.possible} · gate ≥80%</div>
          </div>
        </div>
        <div class="verdict ${pass?"pass":"fail"}">${pass?"Pass — issue certificate":"Not yet competent — review and resit"}</div>
        ${pass ? `
          <div class="certificate-host">
            ${certificateHTML()}
          </div>
        ` : `<p style="margin-bottom:0">Discuss with the trainer which areas to review. Most failed first-passes are on scenarios; re-read lessons 3–6 and attempt again.</p>`}
        <div class="btn-row" style="margin-top:14px">
          ${pass ? `<button class="btn primary" data-act="print-cert">Print certificate</button>` : ""}
          <button class="btn danger" data-act="reset-assessment">Reset</button>
        </div>
      </div>
    ` : `
      <div class="btn-row" style="margin-top:24px">
        <button class="btn primary block" data-act="submit-assessment">Submit & score</button>
      </div>
    `}
  `;
}

function certificateHTML(){
  const a = state.assessment;
  const mcq = mcqScore(); const sc = scenarioScore(); const ov = overallScore();
  return `
    <div class="certificate">
      <div class="cert-brand">Cannabis Cultivation Manual</div>
      <div class="cert-mark">Cultivation Training Programme · Edition 1 · 2026</div>
      <h2 class="cert-title">Certificate of Competence</h2>
      <p class="cert-sub">Grow Room Systems</p>
      <div class="cert-name-lbl">This certifies that</div>
      <div class="cert-name">${escapeHtml(a.name || "—")}</div>
      <p class="cert-body">has demonstrated competence in the systems, levers, balances, failure modes, and diagnostic procedures of medicinal cannabis cultivation rooms.</p>
      <div class="cert-stats">
        <div class="cert-stat"><div class="l">Overall</div><div class="v">${ov.pct}%</div></div>
        <div class="cert-stat"><div class="l">MCQ</div><div class="v">${mcq.correct}/${mcq.total}</div></div>
        <div class="cert-stat"><div class="l">Scenarios</div><div class="v">${sc.sum}/${sc.max}</div></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:14px;text-align:center;margin:6px 0 0">
        <div><div class="cert-stat"><div class="l">Awarded</div><div class="v">${escapeHtml(fmtDate(a.certDate))}</div></div></div>
        <div><div class="cert-stat"><div class="l">Trainer</div><div class="v">${escapeHtml(a.trainer || "—")}</div></div></div>
      </div>
      <div class="sigs">
        <div class="sig"><div class="sig-line"></div><div class="sig-lbl">Trainee signature</div></div>
        <div class="sig"><div class="sig-line"></div><div class="sig-lbl">Trainer signature</div></div>
      </div>
      <div class="cert-id">Cert ID · ${escapeHtml(a.certId || "—")}</div>
    </div>
  `;
}

// =====================================================================
//  ACTIONS — handler table
// =====================================================================
ACTIONS = {
  "open-lesson": n => { setState({ lessonId: parseInt(n.dataset.id,10) }); window.scrollTo(0,0); },
  "self-check": n => {
    const lid = parseInt(n.dataset.lesson,10);
    const q = parseInt(n.dataset.q,10);
    const opt = n.dataset.opt;
    if (!state.selfCheck[lid]) state.selfCheck[lid] = {};
    state.selfCheck[lid][q] = opt;
    render();
  },
  "go-section": n => { setState({ section: n.dataset.section }); window.scrollTo(0,0); },
  "pick-symptom": n => { setState({ wizard: { symptomId: n.dataset.id, step:0, answers:[], resultId:null } }); window.scrollTo(0,0); },
  "wizard-answer": n => {
    const key = n.dataset.key;
    const w = state.wizard;
    const flow = WIZARD_FLOWS[w.symptomId];
    // find current step
    let cur = flow[0];
    for (const ans of w.answers) {
      const opt = cur.opts.find(o => o.k === ans);
      if (opt && opt.go) cur = flow.find(s => s.id === opt.go);
    }
    const picked = cur.opts.find(o => o.k === key);
    if (!picked) return;
    const newAnswers = [...w.answers, key];
    if (picked.done) setState({ wizard: { ...w, answers: newAnswers, resultId: picked.done } });
    else             setState({ wizard: { ...w, answers: newAnswers } });
    window.scrollTo(0,0);
  },
  "wizard-restart": () => { setState({ wizard: { symptomId:null, step:0, answers:[], resultId:null } }); window.scrollTo(0,0); },
  "ref-tab": n => { setState({ refTab: n.dataset.tab, refSelected:null, refSearch:"" }); window.scrollTo(0,0); },
  "ref-select": n => { setState({ refSelected: n.dataset.id }); window.scrollTo(0,0); },
  "start-test": n => {
    const mode = n.dataset.mode;
    if (mode === "quick") setState({ testMode:"quick", quick:{ qIds:[], answers:{}, submitted:false } });
    else                   setState({ testMode:"full" });
    window.scrollTo(0,0);
  },
  "back-test": () => { setState({ testMode:null, quick:{ qIds:[], answers:{}, submitted:false } }); window.scrollTo(0,0); },
  "quick-pick": n => {
    if (state.quick.submitted) return;
    state.quick.answers[n.dataset.q] = n.dataset.opt;
    render();
  },
  "quick-submit": () => { state.quick.submitted = true; render(); window.scrollTo(0,0); },
  "quick-restart": () => { setState({ quick:{ qIds:[], answers:{}, submitted:false } }); window.scrollTo(0,0); },
  "full-pick": n => {
    if (state.assessment.submitted) return;
    state.assessment.answers[n.dataset.q] = n.dataset.opt;
    render();
  },
  "mark-scenario": n => {
    const s = parseInt(n.dataset.s,10);
    const m = parseInt(n.dataset.m,10);
    state.assessment.marks[s] = (state.assessment.marks[s] === m) ? null : m;
    render();
  },
  "submit-assessment": () => {
    if (!state.assessment.name || state.assessment.name.trim().length < 2) {
      alert("Trainee name is required before submitting.");
      return;
    }
    const unanswered = MCQ_BANK.filter(q => !state.assessment.answers[q.id]).length;
    if (unanswered > 0 && !confirm(unanswered + " MCQ(s) unanswered. Submit anyway?")) return;
    state.assessment.submitted = true;
    state.assessment.certDate = new Date();
    state.assessment.certId = generateCertId(state.assessment.certDate);
    render();
    window.scrollTo(0,0);
  },
  "reset-assessment": () => {
    if (!confirm("Reset the assessment? In-memory progress will be wiped.")) return;
    state.assessment = { name:"", trainer:"", answers:{}, scenarios:{1:"",2:"",3:""}, marks:{1:null,2:null,3:null}, submitted:false, certId:null, certDate:null };
    render(); window.scrollTo(0,0);
  },
  "print-cert": () => {
    document.body.dataset.print = "cert";
    setTimeout(() => { window.print(); setTimeout(() => { delete document.body.dataset.print; }, 200); }, 50);
  },
  "close-modal": () => { setState({ defTerm:null }); }
};

window.addEventListener("DOMContentLoaded", render);
</script>
</body>
</html>
