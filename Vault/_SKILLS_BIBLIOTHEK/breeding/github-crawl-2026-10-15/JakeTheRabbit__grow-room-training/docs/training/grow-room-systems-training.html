<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grow Room Systems — Cultivation Training Manual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..800;1,8..60,300..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f1e1;
  --paper-2:#efe7d2;
  --paper-3:#e6dcc1;
  --ink:#1c1812;
  --ink-2:#3d362a;
  --ink-3:#6a604f;
  --rule:#1c1812;
  --rule-soft:#b8ad94;
  --accent:#2d5a3a;
  --accent-soft:#cfe0d4;
  --warn:#8a5a1f;
  --warn-soft:#ecdcb7;
  --risk:#8e2f24;
  --risk-soft:#ecc9c4;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);}
body{
  font-family:var(--serif);
  font-size:18px;
  line-height:1.72;
  font-feature-settings:"onum","liga","kern";
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,h5,h6{font-family:var(--serif);font-weight:600;letter-spacing:-0.005em;color:var(--ink);margin:0 0 0.5em}
h1{font-size:2.6rem;line-height:1.12;font-weight:700}
h2{font-size:1.85rem;line-height:1.18;border-bottom:2px solid var(--rule);padding-bottom:0.35em;margin-top:1.6em}
h3{font-size:1.35rem;line-height:1.28;margin-top:1.4em;color:var(--ink)}
h4{font-size:1.08rem;line-height:1.35;margin-top:1.2em;text-transform:uppercase;letter-spacing:0.06em;font-family:var(--mono);font-weight:600;font-size:0.85rem}
p{margin:0 0 1em;max-width:68ch}
ul,ol{margin:0 0 1em;padding-left:1.3em;max-width:68ch}
li{margin:0 0 0.35em}
a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent)}
a:hover{background:var(--accent-soft)}
hr{border:0;border-top:1px solid var(--rule-soft);margin:2em 0}
code,kbd,samp{font-family:var(--mono);font-size:0.92em;background:var(--paper-2);padding:0.05em 0.35em;border-radius:2px}
small{font-size:0.82em;color:var(--ink-3)}
strong{font-weight:700;color:var(--ink)}
em{font-style:italic}

.app-header{
  position:sticky;top:0;z-index:100;
  background:var(--paper);
  border-bottom:3px double var(--rule);
  padding:0.6em 2.2em;
  display:flex;align-items:center;justify-content:space-between;gap:1.5em;
}
.brand{display:flex;align-items:baseline;gap:0.8em}
.brand .mark{font-family:var(--mono);font-weight:600;letter-spacing:0.18em;font-size:0.75rem;text-transform:uppercase;color:var(--ink-3)}
.brand .title{font-family:var(--serif);font-weight:700;font-size:1.15rem;color:var(--ink)}
.brand .subtitle{font-family:var(--mono);font-size:0.7rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-3)}
.counters{display:flex;gap:1.4em;font-family:var(--mono);font-size:0.72rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-3)}
.counters span b{color:var(--ink);font-weight:600}

.layout{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:296px 1fr;gap:2em;padding:2em 2.2em 5em;align-items:start}

.toc{
  position:sticky;top:88px;
  font-family:var(--mono);font-size:0.78rem;
  border-right:1px solid var(--rule-soft);
  padding-right:1.4em;
  max-height:calc(100vh - 110px);overflow-y:auto;
}
.toc h4{font-family:var(--mono);font-size:0.7rem;letter-spacing:0.12em;color:var(--ink-3);margin-top:1.6em;margin-bottom:0.4em;text-transform:uppercase}
.toc h4:first-child{margin-top:0}
.toc ol{list-style:none;padding:0;margin:0}
.toc li{margin:0}
.toc button{
  display:block;width:100%;text-align:left;
  background:none;border:0;color:var(--ink-2);
  font-family:var(--mono);font-size:0.78rem;
  padding:0.25em 0.4em;cursor:pointer;line-height:1.4;
  border-left:2px solid transparent;
}
.toc button:hover{background:var(--paper-2);color:var(--ink)}
.toc button.active{border-left-color:var(--accent);background:var(--paper-2);color:var(--ink);font-weight:600}
.toc .num{display:inline-block;width:2.4em;color:var(--ink-3)}
.toc button.active .num{color:var(--accent)}

main{max-width:880px;min-width:0}
.chapter-meta{font-family:var(--mono);font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:0.4em}

.key-idea,.example,.science,.def,.warn-box,.risk-box{
  border-left:4px solid var(--rule);
  padding:0.9em 1.2em;
  margin:1.4em 0;
  background:var(--paper-2);
  max-width:68ch;
}
.key-idea{border-left-color:var(--accent);background:var(--accent-soft)}
.example{border-left-color:var(--ink);background:var(--paper-3)}
.science{border-left-color:var(--warn);background:var(--warn-soft)}
.def{border-left-color:var(--ink-2);background:var(--paper);border:1px solid var(--rule-soft);padding:0.7em 1em;margin:0.6em 0}
.warn-box{border-left-color:var(--warn);background:var(--warn-soft)}
.risk-box{border-left-color:var(--risk);background:var(--risk-soft)}
.key-idea h4,.example h4,.science h4,.warn-box h4,.risk-box h4{margin-top:0;color:var(--ink)}
.def .term{font-family:var(--mono);font-weight:600;letter-spacing:0.04em;color:var(--ink);text-transform:none;font-size:0.95em}
.def .gloss{display:inline;margin-left:0.4em;color:var(--ink-2)}
.def p{margin:0.3em 0 0;font-size:0.94em}

.def-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:0.6em;margin:1.2em 0;max-width:none}

table{border-collapse:collapse;width:100%;font-family:var(--serif);font-size:0.92rem;margin:1.2em 0;border-top:2px solid var(--rule);border-bottom:2px solid var(--rule)}
table thead th{
  text-align:left;font-family:var(--mono);font-weight:600;
  font-size:0.72rem;letter-spacing:0.08em;text-transform:uppercase;
  padding:0.55em 0.7em;border-bottom:1px solid var(--rule);color:var(--ink)
}
table tbody td{padding:0.55em 0.7em;border-bottom:1px solid var(--rule-soft);vertical-align:top}
table tbody tr:last-child td{border-bottom:0}
table.compact{font-size:0.86rem}
table.compact td,table.compact th{padding:0.4em 0.55em}
.dir{font-family:var(--mono);font-weight:600}
.dir.up{color:var(--accent)}
.dir.dn{color:var(--risk)}
.dir.eq{color:var(--ink-3)}

.btn{
  font-family:var(--mono);font-weight:500;
  font-size:0.74rem;letter-spacing:0.12em;text-transform:uppercase;
  background:var(--paper);color:var(--ink);
  border:1px solid var(--rule);padding:0.5em 1em;cursor:pointer;
  transition:background 80ms;
}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.btn.primary:hover{background:var(--ink);border-color:var(--ink)}
.btn.ghost{background:transparent;border-color:var(--rule-soft);color:var(--ink-2)}
.btn.danger{border-color:var(--risk);color:var(--risk)}
.btn.danger:hover{background:var(--risk);color:var(--paper)}
.btn[disabled]{opacity:0.4;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:0.5em;margin:0.8em 0}

.chain{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:0.4em;margin:1.4em 0;max-width:none}
.chain-node{
  border:1px solid var(--rule-soft);background:var(--paper);
  padding:0.55em 0.55em;font-family:var(--mono);font-size:0.7rem;
  text-align:left;cursor:pointer;line-height:1.3;
  position:relative;
}
.chain-node .n{display:block;font-weight:600;color:var(--accent);font-size:0.72rem;letter-spacing:0.08em}
.chain-node .label{display:block;color:var(--ink);font-weight:500;margin-top:0.25em}
.chain-node:hover{background:var(--paper-2);border-color:var(--ink)}
.chain-node.selected{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.chain-node.selected .n,.chain-node.selected .label{color:var(--paper)}
.chain-arrow{font-family:var(--mono);color:var(--ink-3);text-align:center;align-self:center;font-size:0.85rem}
.chain-detail{
  border:1px solid var(--rule);background:var(--paper-2);
  padding:1.1em 1.3em;margin:1em 0;max-width:none;
}
.chain-detail .header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--rule-soft);padding-bottom:0.5em;margin-bottom:0.7em}
.chain-detail .badge{font-family:var(--mono);font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-3)}

details.failure{
  border:1px solid var(--rule);background:var(--paper);
  margin:0.8em 0;max-width:none;
}
details.failure summary{
  cursor:pointer;padding:0.8em 1.1em;
  font-family:var(--mono);font-weight:600;font-size:0.85rem;
  display:flex;align-items:baseline;gap:1em;list-style:none;
  border-bottom:1px solid transparent;
}
details.failure summary::-webkit-details-marker{display:none}
details.failure summary::before{content:"+";font-family:var(--mono);color:var(--accent);font-weight:600;width:1em}
details.failure[open] summary::before{content:"−"}
details.failure[open] summary{border-bottom:1px solid var(--rule-soft)}
details.failure .code{color:var(--risk);font-weight:700;letter-spacing:0.06em}
details.failure .name{color:var(--ink);font-weight:600;font-family:var(--serif);font-size:1rem;letter-spacing:0}
details.failure .body{padding:0.9em 1.1em 1.1em;font-family:var(--serif);font-size:0.95rem}
details.failure .body h5{font-family:var(--mono);font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-3);margin:1em 0 0.3em;font-weight:600}

.lever-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0.5em;margin:1em 0;max-width:none}
.lever-tile{
  border:1px solid var(--rule-soft);padding:0.6em 0.8em;
  font-family:var(--mono);font-size:0.78rem;cursor:pointer;background:var(--paper);
  text-align:left;
}
.lever-tile:hover{background:var(--paper-2);border-color:var(--ink)}
.lever-tile.selected{border-color:var(--accent);background:var(--accent-soft)}
.lever-tile .grp{display:block;font-size:0.65rem;letter-spacing:0.1em;color:var(--ink-3);text-transform:uppercase}
.lever-tile .nm{display:block;color:var(--ink);font-weight:600;margin-top:0.2em}
.group-head{font-family:var(--mono);font-size:0.72rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-3);margin:1.2em 0 0.4em;font-weight:600}

.lever-detail{border:1px solid var(--rule);background:var(--paper-2);padding:1.2em 1.4em;margin:1em 0;max-width:none}
.lever-detail .lhead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--rule);padding-bottom:0.5em;margin-bottom:0.8em}
.lever-detail h3{margin:0;font-size:1.2rem}
.lever-detail .pair{display:grid;grid-template-columns:1fr 1fr;gap:1.2em;margin:0.8em 0}
.lever-detail .pair section{border-left:3px solid var(--rule);padding-left:0.9em}
.lever-detail .pair section.up{border-left-color:var(--accent)}
.lever-detail .pair section.dn{border-left-color:var(--warn)}
.lever-detail .pair h5{font-family:var(--mono);font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;margin:0 0 0.4em;color:var(--ink-2);font-weight:600}
.lever-detail ul{margin:0;font-size:0.92rem}

.chip-row{display:flex;flex-wrap:wrap;gap:0.4em;margin:0.8em 0}
.chip{
  font-family:var(--mono);font-size:0.7rem;letter-spacing:0.06em;text-transform:uppercase;
  background:var(--paper);color:var(--ink-2);
  border:1px solid var(--rule-soft);padding:0.35em 0.7em;cursor:pointer;
}
.chip:hover{border-color:var(--ink)}
.chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}

input[type=text],input[type=search],textarea{
  font-family:var(--serif);font-size:1rem;
  background:var(--paper);color:var(--ink);
  border:1px solid var(--rule-soft);padding:0.55em 0.7em;
  width:100%;max-width:520px;
}
textarea{font-size:0.95rem;min-height:120px;font-family:var(--serif);line-height:1.5;resize:vertical}
input[type=text]:focus,input[type=search]:focus,textarea:focus{outline:2px solid var(--accent);border-color:var(--accent)}

.exercises{border-top:2px solid var(--rule);margin-top:2.6em;padding-top:1em}
.exercises h3{font-family:var(--mono);font-size:0.85rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink);margin-top:0}
.exercise{border-left:3px solid var(--accent);padding:0.5em 1em;margin:0.8em 0;background:var(--paper);max-width:68ch}
.exercise .ex-num{font-family:var(--mono);font-size:0.7rem;letter-spacing:0.1em;color:var(--accent);font-weight:600}

.glossary-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:0.4em;margin:1.2em 0;max-width:none}
.glossary-list .def{margin:0}
.glossary-letter{font-family:var(--mono);font-size:0.72rem;letter-spacing:0.12em;color:var(--ink-3);margin-top:1em;font-weight:600;text-transform:uppercase;border-bottom:1px solid var(--rule-soft);padding-bottom:0.2em}

.assessment .question{
  border:1px solid var(--rule);background:var(--paper);
  padding:1em 1.2em;margin:0.7em 0;
}
.assessment .question .q-num{font-family:var(--mono);font-size:0.72rem;letter-spacing:0.1em;color:var(--ink-3);font-weight:600;text-transform:uppercase}
.assessment .question .q-text{font-family:var(--serif);font-size:1.02rem;margin:0.4em 0 0.6em;font-weight:500}
.opt{
  display:block;width:100%;text-align:left;
  font-family:var(--serif);font-size:0.96rem;
  background:var(--paper);color:var(--ink);
  border:1px solid var(--rule-soft);padding:0.55em 0.8em;margin:0.25em 0;cursor:pointer;
}
.opt:hover{background:var(--paper-2)}
.opt.sel{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.opt.correct{background:var(--accent-soft);border-color:var(--accent)}
.opt.wrong{background:var(--risk-soft);border-color:var(--risk)}
.opt .marker{font-family:var(--mono);font-weight:600;margin-right:0.6em;color:var(--ink-3)}
.opt.sel .marker,.opt.correct .marker{color:var(--accent)}
.opt.wrong .marker{color:var(--risk)}
.feedback{font-size:0.88rem;font-family:var(--serif);color:var(--ink-2);margin:0.5em 0 0;font-style:italic;padding:0.4em 0.6em;background:var(--paper-2);border-left:2px solid var(--rule-soft)}

.score-panel{border:2px solid var(--rule);padding:1.2em 1.4em;margin:1.6em 0;background:var(--paper);max-width:none}
.score-panel h3{margin-top:0}
.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1em;margin:1em 0}
.score-grid .score-cell{border:1px solid var(--rule-soft);padding:0.7em 0.9em;background:var(--paper-2)}
.score-grid .score-cell .lbl{font-family:var(--mono);font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-3)}
.score-grid .score-cell .val{font-family:var(--mono);font-size:1.6rem;color:var(--ink);font-weight:600}
.score-grid .score-cell.pass .val{color:var(--accent)}
.score-grid .score-cell.fail .val{color:var(--risk)}
.verdict{font-family:var(--mono);font-size:0.95rem;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;padding:0.6em 1em;margin:0.8em 0}
.verdict.pass{background:var(--accent);color:var(--paper)}
.verdict.fail{background:var(--risk);color:var(--paper)}

.mark-row{display:flex;align-items:center;gap:0.4em;margin:0.5em 0;font-family:var(--mono);font-size:0.8rem}
.mark-row .lbl{color:var(--ink-3);letter-spacing:0.08em;text-transform:uppercase;font-size:0.7rem;margin-right:0.4em}
.mark-btn{
  font-family:var(--mono);font-size:0.85rem;font-weight:600;
  background:var(--paper);border:1px solid var(--rule-soft);
  width:2.4em;height:2.4em;cursor:pointer;color:var(--ink-2)
}
.mark-btn:hover{border-color:var(--ink)}
.mark-btn.sel{background:var(--accent);color:var(--paper);border-color:var(--accent)}

.field-card{
  border:2px solid var(--ink);background:var(--paper);
  padding:1.6em 1.8em;margin:1.6em 0;max-width:none;
  position:relative;
}
.field-card .fc-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:0.5em;margin-bottom:1em}
.field-card .fc-head h3{margin:0;font-size:1.3rem}
.field-card .fc-head .meta{font-family:var(--mono);font-size:0.7rem;letter-spacing:0.1em;color:var(--ink-3);text-transform:uppercase}

.certificate{
  border:6px double var(--ink);padding:2.6em 2.4em;background:var(--paper);
  position:relative;margin:1.4em 0;max-width:none;
}
.certificate::before,.certificate::after{
  content:"";position:absolute;width:24px;height:24px;border:2px solid var(--ink)
}
.certificate::before{top:8px;left:8px;border-right:0;border-bottom:0}
.certificate::after{top:8px;right:8px;border-left:0;border-bottom:0}
.certificate .corner-bl,.certificate .corner-br{position:absolute;width:24px;height:24px;border:2px solid var(--ink)}
.certificate .corner-bl{bottom:8px;left:8px;border-right:0;border-top:0}
.certificate .corner-br{bottom:8px;right:8px;border-left:0;border-top:0}
.certificate .cert-brand{font-family:var(--mono);font-size:0.75rem;letter-spacing:0.24em;text-transform:uppercase;color:var(--ink);text-align:center;margin-bottom:0.4em}
.certificate .cert-mark{text-align:center;font-family:var(--mono);font-size:0.7rem;letter-spacing:0.16em;color:var(--ink-3);margin-bottom:1.4em;text-transform:uppercase}
.certificate .cert-title{text-align:center;font-family:var(--serif);font-size:2.4rem;font-weight:700;margin:0 0 0.2em;letter-spacing:0.01em}
.certificate .cert-sub{text-align:center;font-family:var(--serif);font-style:italic;color:var(--ink-2);margin-bottom:1.4em}
.certificate .cert-name-lbl{text-align:center;font-family:var(--mono);font-size:0.7rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-3);margin-bottom:0.3em}
.certificate .cert-name{text-align:center;font-family:var(--serif);font-size:2.2rem;font-weight:600;font-style:italic;border-bottom:1px solid var(--ink);padding-bottom:0.4em;margin:0 4em 1.4em}
.certificate .cert-body{text-align:center;font-family:var(--serif);font-size:1.05rem;margin:1em 0 1.4em;line-height:1.6}
.certificate .cert-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0.8em;margin:1em 0 1.8em;border-top:1px solid var(--rule-soft);border-bottom:1px solid var(--rule-soft);padding:0.8em 0}
.certificate .cert-stat{text-align:center}
.certificate .cert-stat .l{font-family:var(--mono);font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-3)}
.certificate .cert-stat .v{font-family:var(--mono);font-size:1rem;color:var(--ink);font-weight:600;margin-top:0.2em}
.certificate .sigs{display:grid;grid-template-columns:1fr 1fr;gap:2.4em;margin:2em 1em 0.4em}
.certificate .sig{text-align:center}
.certificate .sig-line{border-bottom:1px solid var(--ink);height:2em;margin-bottom:0.4em}
.certificate .sig-lbl{font-family:var(--mono);font-size:0.7rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-3)}
.certificate .cert-id{text-align:center;font-family:var(--mono);font-size:0.7rem;letter-spacing:0.16em;color:var(--ink-3);margin-top:1.6em;text-transform:uppercase}

.gmp-table{font-size:0.85rem}
.gmp-table th,.gmp-table td{border:1px solid var(--rule)}
.gmp-table td{height:2.4em}

.notice{font-family:var(--mono);font-size:0.78rem;background:var(--warn-soft);border-left:4px solid var(--warn);padding:0.7em 1em;margin:1em 0;max-width:68ch}

.refresh-warn{font-family:var(--mono);font-size:0.7rem;color:var(--warn);letter-spacing:0.06em;background:var(--warn-soft);padding:0.3em 0.7em;display:inline-block;margin:0.6em 0;border:1px solid var(--warn)}

<header class="app-header">
  <div class="brand">
    <span class="mark">L/A</span>
    <span>
      <div class="title">Grow Room Systems</div>
      <div class="subtitle">Cannabis Cultivation Manual</div>
    </span>
  </div>

<div class="layout">

  <main id="main" tabindex="-1"></main>
</div>
<script>
// ============================================================================
//  GROW ROOM SYSTEMS — CANNABIS CULTIVATION TRAINING MANUAL
//  Single-file interactive textbook. No persistence. In-memory state only.
// ============================================================================
"use strict";

const state = {
  chapter: "00",
  chain: { selected: 1, direction: "forward" },
  lever: null,
  trouble: { filter: "", chip: null },
  glossary: { search: "" },
  assessment: {
    name: "",
    trainer: "",
    answers: {},
    scenarios: { 1: "", 2: "", 3: "" },
    marks: { 1: null, 2: null, 3: null },
    submitted: false,
    certId: null,
    certDate: null
  }
};

function setState(patch) {
  Object.assign(state, patch);
  render();
}
function setNested(path, value) {
  const keys = path.split(".");
  let o = state;
  for (let i = 0; i < keys.length - 1; i++) o = o[keys[i]];
  o[keys[keys.length - 1]] = value;
  render();
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" })[c]);
}
function el(id) { return document.getElementById(id); }

// ============================================================================
//  DATA: DEFINITIONS (used by glossary & inline cards)
// ============================================================================
const definitions = [
  { term: "PPFD", expand: "Photosynthetic Photon Flux Density",
    unit: "μmol/m²/s",
    body: "The count of photosynthetically-useful photons (400–700 nm) landing on one square metre of canopy each second. The light the leaf actually receives, not what the fixture is rated for at the lens." },
  { term: "DLI", expand: "Daily Light Integral",
    unit: "mol/m²/day",
    body: "PPFD multiplied by seconds of photoperiod, divided by one million. The total daily photon dose. Stage targets are commonly given as DLI rather than PPFD because the plant integrates over time." },
  { term: "RH", expand: "Relative Humidity",
    unit: "%",
    body: "Water vapour in the air as a percentage of saturation at the current temperature. Same RH at 28 °C holds more water than at 18 °C, which is why RH alone never tells you what the leaf feels." },
  { term: "VPD (air)", expand: "Vapour Pressure Deficit, air-referenced",
    unit: "kPa",
    body: "The gap between the air's current vapour pressure and its saturation pressure at air temperature. A first approximation of evaporative pull." },
  { term: "VPD (leaf)", expand: "Vapour Pressure Deficit, leaf-referenced",
    unit: "kPa",
    body: "The same calculation but using leaf temperature for the saturation reference. Because healthy leaves run cooler than air, leaf VPD is usually lower than air VPD. This is what the stomata actually feel." },
  { term: "Air vs leaf temp", expand: "Canopy thermal offset",
    unit: "°C",
    body: "A healthy, well-transpiring canopy sits 1–3 °C BELOW air temperature because evaporative cooling at the stomata removes heat. If leaf rises to meet air, transpiration has stalled — investigate before yield falls." },
  { term: "Stomata", expand: "Leaf gas-exchange pores",
    unit: "—",
    body: "Microscopic apertures on the leaf underside controlling water loss and CO₂ intake. Open in light, close in dark, and close prematurely as VPD rises. Cannabis stomata begin anticipatory closure around 1.5–1.6 kPa, well before water deficit is severe." },
  { term: "Substrate", expand: "Growing medium",
    unit: "—",
    body: "The inert or semi-inert matrix holding roots — coco coir, rockwool, peat blends. Substrate WC and pore EC are measured properties of this material." },
  { term: "EC (feed)", expand: "Electrical Conductivity of input solution",
    unit: "mS/cm",
    body: "Total dissolved fertiliser salts in the irrigation solution you mix and deliver. What you put in." },
  { term: "EC (substrate / pore)", expand: "Electrical Conductivity in the rootzone",
    unit: "mS/cm",
    body: "Salt concentration of solution actually surrounding the roots, measured by extracting pore water or runoff. Drifts apart from feed EC because plants take water selectively and substrate-surface evaporation concentrates what remains." },
  { term: "pH", expand: "Hydrogen-ion activity",
    unit: "0–14",
    body: "Acidity of feed and rootzone. Cannabis in soilless: feed 5.6–6.2, rootzone tolerant slightly wider. Drives nutrient availability — high pH locks out iron, low pH locks out calcium." },
  { term: "Dryback", expand: "Substrate water loss between irrigations",
    unit: "%",
    body: "Drop in substrate WC from field capacity at the end of an irrigation event to the moment the next event fires. Expressed as % of WC. Targets vary by stage and substrate — e.g. 5–10 % overnight in coco bulk flower." },
  { term: "Runoff", expand: "Drainage from the bottom of the pot",
    unit: "% of feed",
    body: "Solution that leaves the substrate during/after irrigation. Used to leach accumulated salts and to read rootzone EC and pH. 10–20 % runoff is a common target band." },
  { term: "Substrate WC", expand: "Volumetric Water Content of substrate",
    unit: "% v/v",
    body: "Percentage of substrate volume currently occupied by water. Measured by capacitance probe (e.g. TEROS-12). Defines both water availability and oxygen availability." },
  { term: "Sink capacity", expand: "Useful demand for an input",
    unit: "—",
    body: "How much of an input the plant can actually convert into growth before something else becomes limiting. Raising PPFD beyond CO₂ sink capacity is wasted light; raising CO₂ beyond light sink capacity is wasted gas." },
  { term: "Boundary layer", expand: "Still air against leaf surface",
    unit: "—",
    body: "A thin layer of stagnant air that clings to every leaf. CO₂ and water vapour must diffuse through it. Thicker layer = slower gas exchange. Under-canopy airflow exists to thin this layer." },
  { term: "Dew point", expand: "Temperature at which air saturates",
    unit: "°C",
    body: "The temperature any surface must drop to for liquid water to condense on it. If dew point is 18 °C and your wall surface is 17 °C, you have condensation on that wall — and a botrytis window if it touches plant tissue." },
  { term: "Photoperiod", expand: "Hours of light per 24 h",
    unit: "h",
    body: "18/6 in vegetative growth, 12/12 in flowering for photoperiod cultivars. Triggers the morphological switch into bloom." },
  { term: "Spectrum", expand: "Wavelength composition of canopy light",
    unit: "—",
    body: "Blue-rich spectrum compacts morphology; red and far-red drive stretch and transpiration. Mixed white LEDs at warm CCT plus far-red are typical." },
  { term: "ppm (CO₂)", expand: "Parts per million carbon dioxide",
    unit: "ppm",
    body: "Ambient air sits at ~420 ppm. Enriched rooms run 1200–1500 ppm during light hours of high-PPFD flowering. Wasted entirely if not light-limited." },
  { term: "HVAC", expand: "Heating, Ventilation, Air Conditioning",
    unit: "—",
    body: "The combined system that holds room temperature, humidity, and air mixing inside setpoints. In a sealed grow, HVAC also handles latent moisture load from transpiration." },
  { term: "Reheat", expand: "Heating coil downstream of cooling coil",
    unit: "—",
    body: "Allows AC to chase humidity (cool air below dew point to condense water) without dropping room air temperature. Hot gas reheat is the efficient form; electric reheat is the brute-force form." },
  { term: "Sensible load", expand: "Heat that changes temperature",
    unit: "kW",
    body: "Energy that raises air temperature — lights, motors, people. Removed by cooling without affecting moisture." },
  { term: "Latent load", expand: "Heat tied up in evaporated water",
    unit: "kW",
    body: "Energy held in water vapour from transpiration and surface evaporation. Removed by dehumidification (or by AC cold enough to condense water)." },
  { term: "Deadband", expand: "Switching hysteresis",
    unit: "—",
    body: "The temperature/humidity band inside which the controller does nothing. Too tight = short-cycling and wear; too wide = drifting setpoint." },
  { term: "Stratification", expand: "Unmixed vertical layers",
    unit: "—",
    body: "Temperature, RH, or CO₂ varying by height because air is not being mixed enough. Symptom of inadequate horizontal airflow or fan placement." },
  { term: "Negative pressure", expand: "Room pressure below ambient",
    unit: "Pa",
    body: "Achieved by exhaust > intake. Sucks unfiltered outside air in through leaks; bleeds expensive CO₂ out. Useful for odour containment, costly for gas balance." },
  { term: "Botrytis", expand: "Botrytis cinerea — grey mould",
    unit: "—",
    body: "Pathogen that establishes when free water sits on tissue or when local RH stays above ~93–95 % for hours. The classic late-flower disease; the dehumidifier's reason for being." },
  { term: "Powdery mildew (PM)", expand: "Erysiphe / Podosphaera spp.",
    unit: "—",
    body: "Surface fungus thriving in warm, moderately humid, low-airflow micro-climates inside the canopy. Unlike botrytis, does not need free water — it needs stagnant humidity at the leaf." },
  { term: "Osmotic stress", expand: "Restricted root uptake from high salts",
    unit: "—",
    body: "When pore EC climbs, the gradient between root cell and substrate solution shrinks; water and nutrient uptake slows. Tip burn and stalled growth follow." },
  { term: "Hypoxia", expand: "Low oxygen at the roots",
    unit: "—",
    body: "Caused by saturated substrate with no air-filled porosity. Roots cannot respire; root tips die; pathogens move in. The other half of why dryback matters." },
  { term: "Air-filled porosity", expand: "Substrate pore space not full of water",
    unit: "% v/v",
    body: "What is left over when WC drops below field capacity. Roots need this for oxygen. Drives why a saturated pot can starve a plant even with water everywhere." },
  { term: "Photoinhibition", expand: "Damage from light beyond useful demand",
    unit: "—",
    body: "When PPFD exceeds the plant's combined sink capacity (CO₂, water, leaf temp, nutrient delivery), photosystems are damaged. Yield falls; bleaching appears on top colas." },
  { term: "Transpiration", expand: "Water loss through leaf stomata",
    unit: "L/m²/day",
    body: "The evaporative engine. Couples roots, leaves, and air. Drives nutrient delivery (especially calcium and magnesium), leaf cooling, and the moisture load on the HVAC." }
];

function defCard(term) {
  const d = definitions.find(x => x.term === term);
  if (!d) return `<div class="def"><span class="term">${escapeHtml(term)}</span><span class="gloss">(undefined)</span></div>`;
  return `<div class="def"><span class="term">${escapeHtml(d.term)}</span><span class="gloss">— ${escapeHtml(d.expand)}${d.unit && d.unit !== "—" ? " &middot; " + escapeHtml(d.unit) : ""}</span><p>${escapeHtml(d.body)}</p></div>`;
}

window.__chapters = chapters;

function partsIndex() {
  return [
    { part: "Front matter", items: [["00","Preface"]] },
    { part: "Part I — Foundations", items: [["01","How the Plant Works"]] },
    { part: "Part II — The Course", items: [
      ["02","The Coupled Room"],
      ["03","The Chain You Carry"],
      ["04","The Cost of a Lever"],
      ["05","How Rooms Fail"],
      ["06","Reading the Room"]
    ]},
    { part: "Part III — Reference Library", items: [
      ["07","Lever Inspector"],
      ["08","Parameter Cascades"],
      ["09","Equipment Behaviour"]
    ]},
    { part: "Part IV — Glossary", items: [["10","Glossary"]] },
    { part: "Part V — Field Cards", items: [["11","Field Cards"]] },
    { part: "Part VI — Assessment", items: [["12","Competency Assessment"]] },
    { part: "Part VII — Administration", items: [
      ["13","Trainer's Guide"],
      ["14","GMP Register"]
    ]}
  ];
}

function renderTOC() {
  const idx = partsIndex();
  const html = idx.map(group => {
    const items = group.items.map(([id, title]) => {
      const active = id === state.chapter ? " active" : "";
      return `<li><button class="toc-btn${active}" data-chapter="${id}"><span class="num">${id}</span>${escapeHtml(title)}</button></li>`;
    }).join("");
    return `<h4>${escapeHtml(group.part)}</h4><ol>${items}</ol>`;
  }).join("");
  el("toc").innerHTML = html;
  el("toc").querySelectorAll(".toc-btn").forEach(b => {
    b.addEventListener("click", () => setState({ chapter: b.dataset.chapter, lever: null }));
  });
}

function renderHeader() {
  const idx = partsIndex();
  let chapterNum = 0, total = 0, currentTitle = "";
  idx.forEach(g => g.items.forEach(([id, t]) => {
    total++;
    if (id === state.chapter) { chapterNum = total; currentTitle = t; }
  }));
  const a = state.assessment;
  const answered = Object.keys(a.answers).length;
  el("counters").innerHTML =
    `<span>Chapter <b>${String(chapterNum).padStart(2,"0")}/${String(total).padStart(2,"0")}</b></span>` +
    `<span>Current <b>${escapeHtml(currentTitle)}</b></span>` +
    `<span>MCQ <b>${answered}/8</b></span>`;
}

function renderMain() {
  const ch = chapters[state.chapter];
  if (!ch) { el("main").innerHTML = `<p>Chapter ${escapeHtml(state.chapter)} not registered.</p>`; return; }
  el("main").innerHTML = ch.render();
  bindMainEvents();
  el("main").focus({ preventScroll: false });
}

function render() {
  renderTOC();
  renderHeader();
  renderMain();
}

function bindMainEvents() {
  document.querySelectorAll("[data-action]").forEach(node => {
    node.addEventListener("click", e => handleAction(node.dataset.action, node, e));
  });
  document.querySelectorAll("[data-input]").forEach(node => {
    node.addEventListener("input", e => handleInput(node.dataset.input, node));
  });
  document.querySelectorAll("[data-change]").forEach(node => {
    node.addEventListener("change", e => handleInput(node.dataset.change, node));
  });
}

function handleAction(action, node, e) {
  switch (action) {
    case "select-chain-node": {
      const n = parseInt(node.dataset.node, 10);
      state.chain.selected = n;
      render();
      break;
    }
    case "chain-direction": {
      state.chain.direction = node.dataset.dir;
      render();
      break;
    }
    case "select-lever": {
      state.lever = node.dataset.lever;
      render();
      break;
    }
    case "trouble-chip": {
      const chip = node.dataset.chip;
      state.trouble.chip = state.trouble.chip === chip ? null : chip;
      render();
      break;
    }
    case "clear-trouble": {
      state.trouble.filter = "";
      state.trouble.chip = null;
      render();
      break;
    }
    case "mcq-select": {
      const q = node.dataset.q;
      const opt = node.dataset.opt;
      if (state.assessment.submitted) return;
      state.assessment.answers[q] = opt;
      render();
      break;
    }
    case "submit-assessment": {
      submitAssessment();
      break;
    }
    case "reset-assessment": {
      if (confirm("Reset the assessment? In-memory progress will be cleared.")) {
        state.assessment = { name: "", trainer: "", answers: {}, scenarios: {1:"",2:"",3:""}, marks: {1:null,2:null,3:null}, submitted: false, certId: null, certDate: null };
        render();
      }
      break;
    }
    case "mark-scenario": {
      const s = parseInt(node.dataset.scenario, 10);
      const m = parseInt(node.dataset.mark, 10);
      state.assessment.marks[s] = state.assessment.marks[s] === m ? null : m;
      render();
      break;
    }
    case "print-section": {
      const id = node.dataset.section;
      printSection(id);
      break;
    }
    case "goto": {
      setState({ chapter: node.dataset.target, lever: null });
      window.scrollTo({ top: 0, behavior: "smooth" });
      break;
    }
  }
}

function handleInput(target, node) {
  const path = target.split(".");
  let o = state;
  for (let i = 0; i < path.length - 1; i++) o = o[path[i]];
  o[path[path.length - 1]] = node.value;
  if (target === "trouble.filter" || target === "glossary.search") {
    render();
  }
}

function printSection(id) {
  document.body.dataset.print = id;
  setTimeout(() => {
    window.print();
    setTimeout(() => { delete document.body.dataset.print; }, 200);
  }, 50);
}

      { k:"d", t:"The cellular membrane around each stomatal pore." }

    why: "Every leaf carries a film of stagnant air. CO₂ has to push in through it; water vapour has to push out through it. Under-canopy airflow exists to thin this layer. In a dense canopy with no fans below, leaves can suffocate while the room sensor reads perfect numbers."
  },
  { id: "q7",
    text: "A standalone refrigerant dehumidifier sitting inside a sealed flower room:",
    options: [
      { k:"a", t:"Cools the room as it removes moisture." },
      { k:"b", t:"Adds net heat to the room, because compressor work and reheat are both released indoors." },
      { k:"c", t:"Has no thermal effect — it only moves water." },
      { k:"d", t:"Cools more aggressively than a comparable AC unit." }
    ],
    correct: "b",
    why: "The dehum chills air below dew point on a cold coil, then reheats it. The compressor's work and the reheat both end up as room heat. Latent moisture has been turned into sensible heat. The AC then has to remove that heat — which is why dehum capacity and AC capacity are coupled, not independent decisions."
  },
  { id: "q8",
    text: "If you raise PPFD without lifting CO₂, irrigation, or feed EC at the same time:",
    options: [
      { k:"a", t:"Yield rises linearly with light." },
      { k:"b", t:"You hit diminishing return, then negative return — photoinhibition, stalled growth, or environmental failure modes appear." },
      { k:"c", t:"Flowering accelerates by 1–2 days per 100 μmol added." },
      { k:"d", t:"The plant tolerates higher EC as compensation." }
    ],
    correct: "b",
    why: "More light is only useful if every downstream demand it triggers has spare capacity. Push light past the smallest downstream limit — CO₂ supply, root water delivery, dehumidifier headroom, AC headroom — and you make the limiting factor worse, not the light better."
  }

function mcqScore() {
  const a = state.assessment.answers;
  let correct = 0;
  MCQ_BANK.forEach(q => { if (a[q.id] === q.correct) correct++; });
  return { correct, total: MCQ_BANK.length, pct: Math.round((correct / MCQ_BANK.length) * 100) };
}
function scenarioScore() {
  const marks = state.assessment.marks;
  let sum = 0, maxed = 0;
  for (const k of [1,2,3]) {
    if (marks[k] !== null && marks[k] !== undefined) sum += marks[k];
    maxed += 3;
  }
  return { sum, max: maxed, pct: maxed ? Math.round((sum / maxed) * 100) : 0 };
}
function overallScore() {
  const m = mcqScore(); const s = scenarioScore();
  const totalPossible = m.total + s.max;
  const totalEarned = m.correct + s.sum;
  return { earned: totalEarned, possible: totalPossible, pct: Math.round((totalEarned / totalPossible) * 100) };
}
function isPass() {
  const m = mcqScore(); const s = scenarioScore(); const o = overallScore();
  return o.pct >= 80 && m.pct >= 60 && s.pct >= 50;
}
function submitAssessment() {
  if (!state.assessment.name || state.assessment.name.trim().length < 2) {
    alert("Trainee name is required before submitting."); return;
  }
  const unanswered = MCQ_BANK.filter(q => !state.assessment.answers[q.id]).length;
  if (unanswered > 0) {
    if (!confirm(unanswered + " MCQ question(s) are unanswered. Submit anyway?")) return;
  }
  state.assessment.submitted = true;
  state.assessment.certDate = new Date();
  state.assessment.certId = generateCertId(state.assessment.certDate);
  render();
}
function generateCertId(d) {
  const pad = n => String(n).padStart(2, "0");
  const y = d.getFullYear();
  const mo = pad(d.getMonth() + 1);
  const da = pad(d.getDate());
  const hh = pad(d.getHours());
  const mm = pad(d.getMinutes());
  const seq = String(Math.floor(1000 + Math.random() * 9000));
  return `GRS-${y}${mo}${da}-${hh}${mm}-${seq}`;
}
function fmtDate(d) {
  if (!d) return "";
  const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

    <p><strong>Order of operations:</strong> (1) air-circulation check — is there under-canopy movement? Lack of mixing held leaves cooler than air longer. (2) Day-night air temp delta check — too cold overnight means a wider catch-up gap at lights-on. (3) Lights-on ramp — instantaneous full power vs a 15-minute ramp; ramp gives the canopy time to warm with the air. (4) Defoliation review if canopy was wet on lower leaves too.</p>

    <p><strong>Diagnosis:</strong> Two mechanisms drive pore EC away from feed — selective uptake and evaporative concentration. Either or both are responsible. Most likely cause in five days: transpiration rose (anything from a PPFD lift, a temp lift, a defoliation that exposed more canopy, or a humidity drop) → dryback deepened → pore EC concentrated.</p>
    <p><strong>Three measurements:</strong> (1) dryback % over the 5-day window — is it deeper than target? (2) runoff fraction — is it lower than target? (3) leaf-VPD trend — is it rising? Each cuts a different candidate cause: (1) tests the dryback/concentration mechanism, (2) tests the leaching path, (3) tests whether transpiration drove the change.</p>
    <p><strong>Lever:</strong> raise runoff fraction first (the leaching path) before adjusting feed EC. Dropping feed EC while dryback is still deep just delays the climb one cycle.</p>
    <p><strong>3-mark indicators:</strong> names both mechanisms explicitly, defends why feed EC alone is the wrong lever, identifies that the climate change is upstream and would otherwise come back.</p>

    <h3>Scenario 3 — PPFD 700 → 950, upper canopy midday wilt 2 days later</h3>
    <p><strong>Diagnosis:</strong> Classic F-01 — light was raised past the smallest available downstream capacity. Upper canopy wilt with lower fine = the top is transpiration-limited, not whole-plant water deficit. The chain: Node 1 ↑ → Node 4 ↑ → Node 5 deeper → Node 6 pore EC climbed → Node 7 water status at the top dropped → defensive stomatal closure → can't keep up with light demand → wilt. Alternatively, leaf-VPD pushed past 1.5 kPa and stomata closed in anticipation. Most likely: pore EC climbed and root supply cannot keep up at the top.</p>
    <p><strong>First measurement:</strong> pore EC and leaf-VPD on the upper canopy.</p>

      <li><strong>"Higher VPD always pushes more transpiration."</strong> — Only up to ~1.5 kPa. Beyond, cannabis stomata close in defence.</li>

    </ul>

    <h2>The three things a leaf is doing all day</h2>
    <p>
      A cannabis leaf in light is doing three coupled jobs simultaneously. It is taking in
      CO₂, splitting water, and assembling sugars. None of the three runs independently of
      the others. If one stops, the other two cannot proceed.
    </p>

    <div class="key-idea">
      <h4>Photosynthesis in one sentence</h4>
      <p style="margin:0">
        Light energy splits water inside the chloroplast and uses the result, together with
        CO₂ pulled in from the air, to build sugar — which is then exported through the leaf
        and turned into roots, stems, flowers, and resin.
      </p>
    </div>

      Three inputs are required at every instant: <strong>photons</strong> (light),
      <strong>water</strong> (from the roots, via the xylem), and <strong>CO₂</strong> (from
      the air, via the stomata). Whichever of these is in shortest supply caps the whole
      operation. Pour more of the other two in and you make no extra sugar. You can only
      waste the abundance, or break something.
    </p>

    <h3>Transpiration — the engine that powers everything else</h3>
    <p>
      Water enters the plant at the roots, climbs the xylem under tension, and leaves
      through the stomata as vapour. This evaporation is called transpiration, and it does
      three jobs that the plant cannot do any other way:
    </p>
    <ol>
      <li><strong>It cools the leaf.</strong> Each gram of water that evaporates from the leaf carries roughly 2.4 kilojoules of latent heat with it. A healthy, transpiring canopy sits 1–3 °C BELOW the air temperature around it — not above, not equal. If you measure the leaf and it has risen to meet the air, transpiration has stalled and you should already be reaching for the dehumidifier or the airflow fan.</li>
      <li><strong>It delivers nutrients.</strong> Some nutrients move freely once inside the plant, but calcium, magnesium, manganese, and boron travel essentially only in the transpiration stream. A plant that has stopped transpiring also stops delivering calcium to its new tissue, which is why low-VPD failures show up first as soft growth, tip-rot, and leaf curl on the upper canopy.</li>
      <li><strong>It creates the suction that pulls water from the roots.</strong> No separate pump exists in the plant. Evaporation at the leaf creates negative pressure in the xylem, which pulls a continuous water column upward from root to canopy.</li>
    </ol>

        well-mixed room. Healthy canopies are <strong>1–3 °C below air</strong> due to evaporative
        cooling. A leaf that reads at or above air temperature has either lost stomatal control
        (closed in response to high VPD) or run out of root-zone water — both of which require
        immediate intervention before they become calcium deficiency, edge burn, or

      close in dark. They are also the only path by which CO₂ enters the leaf, so when they

      reasons inside our control:
    </p>
